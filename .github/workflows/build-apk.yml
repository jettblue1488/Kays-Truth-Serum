name: Build Kay's Truth Serum APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Kays-Truth-Serum-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
